name: Daily Premier League Data Pipeline & Hugging Face Sync

on:
  schedule:
    # Run daily at 03:00 UTC (after all daily matches and data feeds finalize)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season identifier to update (e.g. 2026_2027)'
        required: true
        default: '2026_2027'
      sync_hf:
        description: 'Upload & synchronize datasets to Hugging Face Hub'
        type: boolean
        required: true
        default: true
      push_git:
        description: 'Commit updated CSV datasets back to Git repo'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: epl-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl-and-sync:
    name: Crawl, Normalize, Validate & Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EPL Daily Pipeline & Feature Engine
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID || 'Toibinguz/epl-premier-league-dataset' }}
        run: |
          SEASON="${{ github.event.inputs.season || '2026_2027' }}"
          SYNC_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.sync_hf }}" = "true" ]; then
            SYNC_FLAG="--sync-hf"
          fi
          
          python scripts/daily_update_pipeline.py \
            --season "$SEASON" \
            $SYNC_FLAG \
            --repo-id "${HF_REPO_ID}"

      - name: Validate Referential Integrity & Schemas
        run: |
          python scripts/validate_normalized_data.py

      - name: Commit & Push Updated Data to Git
        if: ${{ github.event_name == 'schedule' || github.event.inputs.push_git == true }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          SEASON="${{ github.event.inputs.season || '2026_2027' }}"
          git add "data/${SEASON}" data/00_master_entities/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update Premier League data for ${{ github.event.inputs.season || '2026_2027' }} [skip ci]"
            git push
          fi

      - name: Generate Pipeline Summary Report
        if: always()
        run: |
          echo "### Premier League Daily Data Pipeline Execution Report ⚽" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Season**: ${{ github.event.inputs.season || '2026_2027' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dataset Hub Sync**: ${{ secrets.HF_TOKEN != '' && 'Enabled' || 'Skipped (No HF_TOKEN configured)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Table | Record Count | Location |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          find data/2026_2027 -name "*.csv" | sort | while read -r f; do
            count=$(wc -l < "$f" | awk '{print $1-1}')
            echo "| \`$(basename "$f")\` | $count rows | \`$f\` |" >> $GITHUB_STEP_SUMMARY
          done

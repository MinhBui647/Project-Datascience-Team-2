name: Daily Premier League Raw Data Pipeline & Hugging Face Sync

on:
  schedule:
    # Run daily at 03:00 UTC (after all daily matches and data feeds finalize)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      sync_hf:
        description: 'Upload & synchronize season 2026_2027_new to Hugging Face Hub'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: epl-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl-and-sync:
    name: Daily Incremental Crawl & Season 2026/27 Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run EPL Daily Incremental Raw Crawler & Sync Current Season
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          SYNC_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.sync_hf }}" = "false" ]; then
            SYNC_FLAG="--no-sync"
          fi
          python crawler_pipeline/daily_raw_crawler.py $SYNC_FLAG

      - name: Generate Pipeline Execution Summary
        if: always()
        run: |
          echo "### Premier League Daily Raw Data Pipeline Report ⚽" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Season**: 2026/27 Active Season (Folder: \`2026_2027_new\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Hugging Face Hub Sync**: ${{ secrets.HF_TOKEN != '' && 'Enabled (Toibinguz/epl-premier-league-dataset)' || 'Skipped (No secret configured)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 2026_2027_new Item | Path / Location |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Match Outcomes & Odds | \`2026_2027_new/football_data_raw_2627.csv\` |" >> $GITHUB_STEP_SUMMARY
          echo "| FPL Players & Fixtures | \`2026_2027_new/fpl_bootstrap_latest.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Understat Overview | \`2026_2027_new/understat_raw_2026_2027.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| FotMob Fixtures | \`2026_2027_new/fotmob_fixtures_2026_2027.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Match Details (Understat) | \`2026_2027_new/matches/understat/*.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Match Details (FotMob) | \`2026_2027_new/matches/fotmob/*.json\` |" >> $GITHUB_STEP_SUMMARY
